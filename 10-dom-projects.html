  <body>

    <p>
      YouTube Subscribe Button
    </p>

    <button class="js-subscribe-button subscribe-button"
    
    onclick="
      subscribe()
    ">Subscribe</button>

    <p>
      Amazon Shipping Calculator
    </p>
    <input onkeydown ="
    handlecostkeydown(event)
  
    "
    
    class ="js-costinput cost-input" placeholder = "Cost Of Order">
    <Button onclick="
    calculatetotal()
    
    "
    class="calculate-button">
      Calculate
    </Button>

    <p class = 'js-totalcost'>
      
    </p>



    <script>

      String(67)
      console.log('25' - 5);
      console.log("25" + 5);


      window.console.log('Hi')
      window.document


function handlecostkeydown(event){
    console.log('typing');
    console.log(event.key);

    if(event.key === 'Enter'){
      calculatetotal();
    }
    
}

      function calculatetotal(){

        const cost = document.querySelector('.js-costinput')

       let costvalue = Number (cost.value);

       if(costvalue < 40){
        costvalue+=10;
       }

       document.querySelector('.js-totalcost')
       .innerHTML = `$${costvalue}`;
      }



      function subscribe(){
        const buttonElement = document.querySelector('.js-subscribe-button');

      if (buttonElement.innerText === 'Subscribe'){

        buttonElement.innerText = 'Subscribed';
        buttonElement.classList.add('is-subscribed');
      }
      else{
        buttonElement.innerText = 'Subscribe'
        buttonElement.classList.remove('is-subscribed');
      }
      }

    </script>


  </body>
