<!DOCTYPE html>
<html>
  <head>
    <title>
      DOM Calculator
    </title>
  </head>





  <body>
    <button onclick="calculation+=1; resultgetter()">
      1
    </button>

    <button onclick="calculation+=2; resultgetter()">
      2
    </button>

    <button onclick="calculation+=3; resultgetter()">
      3
    </button>

    <button onclick="calculation+='+'; resultgetter()" >
      +
    </button>

    <button onclick="calculation = eval(calculation); 
    resultgetter()
       localStorage.setItem('result', JSON.stringify(calculation))
       ">
      =
    </button>
    <p class = "result">The result is: </p>

    <script>
      function resultgetter(){
      document.querySelector('.result').innerText = `The result is ${calculation}`;
      }

      calculation = ''
      prev = JSON.parse(localStorage.getItem('result'))
      console.log(prev)
    </script>
  </body>
</html>
