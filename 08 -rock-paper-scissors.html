<!DOCTYPE html>
<html>
  <head>
    <title>
      Rock Paper Scissors
    </title>
  </head>

  <body>
    <p>Rock Paper scissors</p>


    <button onclick="
    playermove ='rock';
    compareResult(playermove);
    ">
      Rock 
    </button>

    <button onclick="
    playermove = 'paper';
    compareResult(playermove);
    ">
      Paper
    </button>

    <button onclick="
    playermove = 'scissors';
    compareResult(playermove)
    ">
      Scissors
    </button>

    <button onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score');
    ">
      Reset Score
    </button>


    <script>

      let score = JSON.parse(localStorage.getItem('score')) || {
          Wins:0,
          losses:0,
          Ties:0};


      console.log(JSON.parse(localStorage.getItem('score')));


      function computerGuess(){
        rand = Math.random();

        if(rand>=0 && rand <=1/3){
          compguess = 'rock';
        }
        else if(rand >1/3 && rand <=2/3){
          compguess = 'paper';
        }
        else if(rand >2/3 && rand <=1){
          compguess = 'scissors';
        }
        return compguess;
      }

      function compareResult(playermove){

        c_guess = computerGuess();

        if(playermove === 'rock'){

          
          if(c_guess === 'rock'){
            result = 'tie'
          }
          else if(c_guess === 'paper'){
            result = 'you lose'
          }
          else if(c_guess === 'scissors'){
            result = 'you win'
          }
        }
      else if(playermove === 'paper'){
        if(c_guess === 'rock'){
          result = 'you win'
        }
        else if(c_guess === 'paper'){
          result = 'tie'
        }
        else if(c_guess === 'scissors'){
          result = 'you lose'
        }
      }
      else if(playermove === 'scissors'){
        if(c_guess === 'rock'){
          result = 'you lose'
        }
        else if(c_guess === 'paper'){
          result = 'you win'
        }
        else if(c_guess === 'scissors'){
          result = 'tie'
        }
      }

      if(result === 'you win'){
        score.Wins++;
      }
      else if(result === 'you lose'){
        score.losses++;
      }
      else if(result === 'tie'){
        score.Ties++;
      }
      localStorage.setItem('score', JSON.stringify(score));

      alert(`you picked ${playermove}, Computer picked ${c_guess}, ${result}
      Wins: ${score.Wins}, losses: ${score.losses}, Ties: ${score.Ties}`)
      }

    </script>
  </body>
</html>
