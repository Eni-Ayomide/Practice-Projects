<!DOCTYPE html>
<html>
  <head>
  <title>
    Cart Quantity
  </title>
  </head>

  <body>
    <button onclick="cartQuantity-=3;">
      -3
    </button>
    <button onclick="cartQuantity-=2;">
      -2
    </button>
    <button onclick="cartQuantity--;">
      Remove from cart
    </button>
    <button onclick="cartQuantity + 5;">
      +5
    </button>
    <button onclick="cartQuantity + 4;">
      +4
    </button>
    <button onclick="
      console.log(`Cart Quantity: ${cartQuantity}`);
      ">
      Show Quantity
    </button>

    <button onclick="
    cartQuantity=cartQuantity +1;
    console.log(`Cart Quantity: ${cartQuantity}`);
    ">
      Add to cart
    </button>

    <button onclick="
    cartQuantity=cartQuantity+2;
    console.log(`Cart Quantity: ${cartQuantity}`);
    ">
      +2
    </button>

    <button onclick="
    cartQuantity=cartQuantity+2;
    console.log(`Cart Quantity: ${cartQuantity}`);">
      +3
    </button>

    <button onclick="
    cartQuantity=cartQuantity-cartQuantity;
    console.log(`Cart Quantity: ${cartQuantity}`);">
      Reset Cart
    </button>

    <script>
      cartQuantity = 0;

    </script>

  </body>
</html>
