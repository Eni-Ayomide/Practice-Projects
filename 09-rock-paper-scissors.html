<!DOCTYPE html>
<html>
  <head>
    <title>
      Rock Paper Scissors
    </title>
  </head>

  <body>
    <p>Rock Paper scissors</p>


    <button onclick="
    playermove ='rock';
    compareResult(playermove);
    ">
      Rock 
    </button>

    <button onclick="
    playermove = 'paper';
    compareResult(playermove);
    ">
      Paper
    </button>

    <button onclick="
    playermove = 'scissors';
    compareResult(playermove)
    ">
      Scissors
    </button>

    <p class="js-score">

    </p>

    <p class="js-result"></p>

    <p class ="js-moves"></p>

    <button onclick="
    score.Wins = 0;
    score.losses = 0;
    score.Ties = 0;
    localStorage.removeItem('score');
    updatescoreElement();
    ">
      Reset Score
    </button>


    <script src="scripts/09-rockpaperscissors.js">
    
    </script>
