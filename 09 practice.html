<!DOCTYPE html>
<html>
  <head>
    <title>
      DOM exercises
    </title>
  </head>

  <body>

    <button>
      9a
    </button>


    <button class = "button2">
      9b
    </button>


    <br>
    <br>
    <button class ="headc" onclick="responsechanger()">
      Heads
    </button>

    <button class = "headc" onclick="responsechanger(this)">
      Tails
    </button>

    <p class = "response"> Hello</p>

    <script>
      let button = document.querySelector(".headc")

      function responsechanger(button){
        
        if(button.innerText === 'Heads'){
          document.querySelector(".response").innerText = "You Chose: Heads";
        }
        else if(button.innerText === 'Tails'){
          document.querySelector(".response").innerText = "You Chose: Tails";
        }


      }
    </script>
  </body>
</html>
