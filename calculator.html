<!DOCTYPE html>
<html>
  <head>
    <title>
      Mini Calculator
    </title>
  </head>





  <body>
    <button onclick="calculation+=1; console.log(calculation);">
      1
    </button>

    <button onclick="calculation+=2;  console.log(calculation);">
      2
    </button>

    <button onclick="calculation+=3; console.log(calculation); ">
      3
    </button>

    <button onclick="calculation+='+'; console.log(calculation);" >
      +
    </button>

    <button onclick="calculation = eval(calculation); console.log(calculation)
       localStorage.setItem('result', JSON.stringify(calculation))
       ">
      =
    </button>

    <script>
      calculation = ''
      prev = JSON.parse(localStorage.getItem('result'))
      console.log(prev)
    </script>
  </body>
</html>
